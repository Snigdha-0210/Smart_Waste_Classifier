[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-waste-classifier"
version = "2.0.0"
description = "Enterprise-Grade Multi-Stage Deep Learning Platform for Solid Waste Segregation & Object Detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Snigdha-0210" }
]
keywords = [
    "deep-learning",
    "computer-vision",
    "waste-management",
    "recycling",
    "resnet",
    "yolov11",
    "streamlit",
    "pytorch"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "streamlit>=1.30.0",
    "datasets>=2.14.0",
    "numpy>=1.22.0",
    "pandas>=1.5.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "Pillow>=9.0.0",
    "requests>=2.28.0",
    "ultralytics>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/Snigdha-0210/Smart_Waste_Classifier"
Documentation = "https://github.com/Snigdha-0210/Smart_Waste_Classifier/blob/main/ARCHITECTURE.md"
Repository = "https://github.com/Snigdha-0210/Smart_Waste_Classifier.git"
Issues = "https://github.com/Snigdha-0210/Smart_Waste_Classifier/issues"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
